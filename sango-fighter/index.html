<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>三國志格鬥 G3KingFight</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="gameCanvas" width="1024" height="576"></canvas>

      <div id="title-screen" class="screen" style="background: linear-gradient(135deg, #0f0c29, #1a1533, #24243e); border: 2px solid #c9a84c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;">
        <h1 class="title">三國志格鬥</h1>
        <h2 class="subtitle">G3KingFight — Vanilla JavaScript Edition</h2>
        <div style="display:flex;flex-direction:column;gap:12px;align-items:center;">
          <button id="btn-vs-mode" class="mode-btn">VS Mode</button>
          <button id="btn-story-mode" class="mode-btn story-mode-btn">Story Mode</button>
          <button id="btn-title-move-list" class="mode-btn movelist-btn">Move List</button>
          <button id="btn-title-stage-list" class="mode-btn stagelist-btn">Stage List</button>
        </div>
        <div id="difficultySelect" class="difficulty-select">
          <span class="difficulty-label">難度：</span>
          <button class="diff-btn selected" data-diff="easy">初級</button>
          <button class="diff-btn" data-diff="normal">中級</button>
          <button class="diff-btn" data-diff="hard">高級</button>
        </div>
        <div class="controls-info">
          <div class="controls-column">
            <h4>P1</h4>
            <div>WASD 移動</div>
            <div>J/K/L/U 攻擊</div>
            <div>M 招式表 / P 暫停</div>
          </div>
          <div class="controls-column">
            <h4>P2</h4>
            <div>方向鍵移動</div>
            <div>Num1/2/3/0 攻擊</div>
            <div>Enter 確認</div>
          </div>
        </div>
      </div>

      <div id="character-select" class="hidden"></div>
      <div id="stage-select" class="hidden"></div>
      <div id="story-mode" class="hidden"></div>
      <div id="dialog-box" class="hidden"></div>
      <div id="move-list-overlay" class="hidden"></div>
      <div id="pause-menu" class="hidden"></div>
      <div id="mobile-controls" class="hidden"></div>
      <div id="loading-screen" class="screen hidden" style="position:absolute;inset:0;background:rgba(10,10,26,0.96);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:90;">
        <h2 class="title" style="font-size:32px;">載入中...</h2>
        <div class="subtitle">Preparing Sango Fighter</div>
      </div>
    </div>

    <script defer src="constants.js"></script>
    <script defer src="characters.js"></script>
    <script defer src="stories.js"></script>
    <script defer src="spriteGenerator.js"></script>
    <script defer src="classes.js"></script>
    <script defer src="renderer.js"></script>
    <script defer src="ai.js"></script>
    <script defer src="ui.js"></script>
    <script defer src="game.js"></script>
  </body>
</html>
