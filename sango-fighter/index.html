<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>武將爭霸 Sango Fighter</title>
  <link rel="stylesheet" href="style.css">
  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <style>
    /* Start screen overlay — displayed on top of everything */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: linear-gradient(135deg, #0f0c29, #1a1533, #24243e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    #start-screen .title {
      font-size: 52px;
      color: #ffd700;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 20px rgba(255,215,0,0.3);
      letter-spacing: 8px;
    }
    #start-screen .subtitle {
      font-size: 18px;
      color: #c9a84c;
      letter-spacing: 4px;
    }
    #start-btn {
      margin-top: 20px;
      padding: 16px 48px;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #b22222, #8b0000);
      border: 2px solid #ffd700;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 4px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,215,0,0.5);
    }
    .controls-info {
      display: flex;
      gap: 40px;
      margin-top: 16px;
      font-size: 14px;
      color: #aaa;
    }
    .controls-info h4 {
      color: #ffd700;
      margin-bottom: 6px;
    }
    .controls-info div {
      margin: 2px 0;
    }
    /* Phaser canvas container */
    #game-container {
      display: none;
      width: 1024px;
      height: 576px;
      margin: 0 auto;
    }
    /* Version badge */
    #versionDisplay {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 12px;
      color: #666;
      z-index: 200;
    }
  </style>
</head>
<body>
  <!-- ===== Start Screen (HTML UI) ===== -->
  <div id="start-screen">
    <h1 class="title">武將爭霸</h1>
    <h2 class="subtitle">Sango Fighter — Phaser 3 Edition</h2>
    <button id="start-btn">開始遊戲 START</button>
    <div class="controls-info">
      <div>
        <h4>P1 操作</h4>
        <div>A / D — 左右移動</div>
        <div>W — 跳躍</div>
        <div>J — 攻擊</div>
      </div>
    </div>
  </div>

  <!-- ===== Phaser Game Container ===== -->
  <div id="game-container"></div>

  <!-- Version Display -->
  <div id="versionDisplay">V12-Phaser3</div>

  <script src="game.js"></script>
</body>
</html>
